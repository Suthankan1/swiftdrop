# ==============================================================================
# SwiftDrop Platform — Azure K3s Application Helm Values
# Canonical Reference: docs/deployment/OPTIONAL_AZURE_K3S_SPENDING_AUTHORIZATION.md
# Invariant: External HTTPS on port 443; Keycloak admin disabled; persistent DBs.
# Verified immutable linux/amd64 runtime images from GitHub Actions run #42387115452.
# ==============================================================================

global:
  clusterDomain: cluster.local
  # GHCR packages (ghcr.io/suthankan1/swiftdrop-*) are public; anonymous pull is supported.
  # Kubernetes imagePullSecrets is supported if private registries or credentials are used:
  imagePullSecrets: []

namespaces:
  apps: swiftdrop-apps
  identity: swiftdrop-identity
  data: swiftdrop-data
  messaging: swiftdrop-messaging
  system: swiftdrop-system

# Ingress Configuration terminating TLS on K3s embedded Traefik
ingress:
  enabled: true
  className: traefik
  host: demo.swiftdrop.net
  subdomains:
    enabled: true
    app: app.demo.swiftdrop.net
    api: api.demo.swiftdrop.net
    auth: auth.demo.swiftdrop.net
  tls:
    enabled: true
    secretName: swiftdrop-tls-cert
  keycloak:
    exposeAdmin: false # Keycloak admin interface is strictly denied external access
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

networkPolicies:
  enabled: true
  defaultDeny: true

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/suthankan1/swiftdrop-frontend
    tag: 95c4b0f
    digest: sha256:5ed569ffac2ec50001c4c3b3f1cf1ac466cc7a30de5ee81f4cbf4361f9a6d76a
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

apiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/suthankan1/swiftdrop-api-gateway
    tag: 95c4b0f
    digest: sha256:62e0a3e7c2a54d9c0b63be2bb1306ceba5d4b8242009c666d595de816bcf1993
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    keycloakIssuerUri: https://auth.demo.swiftdrop.net/realms/swiftdrop
    keycloakJwksUri: http://keycloak.swiftdrop-identity.svc.cluster.local:8080/realms/swiftdrop/protocol/openid-connect/certs
    corsAllowedOrigin: "https://demo.swiftdrop.net,https://app.demo.swiftdrop.net"
    javaToolOptions: "-XX:+UseContainerSupport -Xms96m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+ExitOnOutOfMemoryError"

