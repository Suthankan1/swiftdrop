# ==============================================================================
# SwiftDrop Platform — Monitoring ServiceAccounts (Issue #160)
# Minimal privilege, disabled automount of API tokens where not needed.
# ==============================================================================

{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftdrop-prometheus-sa
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

{{- if .Values.blackboxExporter.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftdrop-blackbox-sa
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "blackbox-exporter") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
