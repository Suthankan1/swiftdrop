# ==============================================================================
# SwiftDrop Platform — Alertmanager Configuration (Issue #160)
# Private grouping, severity routing, Mailpit SMTP transport, and inhibition.
# ==============================================================================

{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-alertmanager-config
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "alertmanager") | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: '{{ .Values.alertmanager.config.mailHost }}:{{ .Values.alertmanager.config.mailPort }}'
      smtp_from: '{{ .Values.alertmanager.config.mailFrom }}'
      smtp_require_tls: false

    route:
      group_by: ['alertname', 'service', 'severity']
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'operator-mailpit-sink'
      routes:
        - match:
            severity: critical
          receiver: 'operator-mailpit-sink'
          continue: false
        - match:
            severity: warning
          receiver: 'operator-mailpit-sink'
          continue: false

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['service']

    receivers:
      - name: 'operator-mailpit-sink'
        email_configs:
          - to: '{{ .Values.alertmanager.config.mailTo }}'
            send_resolved: true
            headers:
              Subject: '{{ `[SWIFTDROP {{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .CommonLabels.service }})` }}'
{{- end }}
