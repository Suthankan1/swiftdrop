# ==============================================================================
# SwiftDrop Platform — Grafana Protected Deployment (Issue #160)
# Anonymous access disabled, declarative provisioning, secret-backed credentials.
# ==============================================================================

{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftdrop-grafana
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "grafana") | nindent 4 }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "swiftdrop-monitoring.selectorLabels" (dict "context" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "grafana") | nindent 8 }}
    spec:
      serviceAccountName: swiftdrop-grafana-sa
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.grafana.securityContext.runAsUser }}
        runAsGroup: {{ .Values.grafana.securityContext.runAsGroup }}
        fsGroup: {{ .Values.grafana.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ include "swiftdrop-monitoring.image" .Values.grafana.image }}
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.grafana.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.grafana.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.secretRefs.adminSecretName }}
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "false"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "false"
            - name: GF_PATHS_DATA
              value: "/var/lib/grafana"
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage-volume
              mountPath: /var/lib/grafana
            - name: datasource-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provider-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards-health
              mountPath: /var/lib/grafana/dashboards/health
              readOnly: true
            - name: dashboards-ops
              mountPath: /var/lib/grafana/dashboards/ops
              readOnly: true
      volumes:
        - name: storage-volume
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: swiftdrop-grafana-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: datasource-provisioning
          configMap:
            name: swiftdrop-grafana-datasources
        - name: provider-provisioning
          configMap:
            name: swiftdrop-grafana-providers
        - name: dashboards-health
          configMap:
            name: swiftdrop-grafana-dashboards-health
        - name: dashboards-ops
          configMap:
            name: swiftdrop-grafana-dashboards-ops
{{- end }}

