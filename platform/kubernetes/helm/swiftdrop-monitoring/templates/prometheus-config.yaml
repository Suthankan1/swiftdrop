# ==============================================================================
# SwiftDrop Platform — Prometheus Configuration ConfigMap (Issue #160)
# Declarative scrape jobs, blackbox readiness probes, and actionable rules.
# ==============================================================================

{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-prometheus-config
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'swiftdrop-alertmanager.{{ .Values.namespaces.monitoring }}.svc.{{ .Values.global.clusterDomain }}:9093'

    scrape_configs:
      - job_name: 'prometheus'
        metrics_path: /metrics
        static_configs:
          - targets: ['127.0.0.1:9090']

      - job_name: 'swiftdrop-readiness'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - 'http://api-gateway.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8080/actuator/health'
              - 'http://accounts-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8081/actuator/health'
              - 'http://pricing-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8082/actuator/health'
              - 'http://delivery-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8083/actuator/health'
              - 'http://communications-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8084/actuator/health'
              - 'http://graphql-query-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8085/actuator/health'
              - 'http://frontend.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8080/health'
              - 'http://keycloak.{{ .Values.namespaces.identity }}.svc.{{ .Values.global.clusterDomain }}:9000/health/ready'
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: 'swiftdrop-blackbox-exporter.{{ .Values.namespaces.monitoring }}.svc.{{ .Values.global.clusterDomain }}:9115'

      - job_name: 'swiftdrop-apps'
        metrics_path: /actuator/prometheus
        scrape_interval: {{ .Values.prometheus.scrapeInterval }}
        static_configs:
          - targets:
              - 'api-gateway.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8080'
              - 'accounts-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8081'
              - 'pricing-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8082'
              - 'delivery-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8083'
              - 'communications-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8084'
              - 'graphql-query-service.{{ .Values.namespaces.apps }}.svc.{{ .Values.global.clusterDomain }}:8085'

      - job_name: 'alertmanager'
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'swiftdrop-alertmanager.{{ .Values.namespaces.monitoring }}.svc.{{ .Values.global.clusterDomain }}:9093'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-prometheus-rules
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "swiftdrop-monitoring.componentLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
data:
  swiftdrop-alerts.yaml: |
{{ .Files.Get "files/alerts/swiftdrop-alerts.yaml" | indent 4 }}
{{- end }}

