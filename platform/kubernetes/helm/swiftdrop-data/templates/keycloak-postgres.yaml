{{- if .Values.keycloakPostgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: {{ .Values.namespaces.data }}
  labels:
    {{- include "swiftdrop-data.componentLabels" (dict "context" . "component" "keycloak-postgres") | nindent 4 }}
spec:
  type: {{ .Values.keycloakPostgres.service.type }}
  selector:
    {{- include "swiftdrop-data.selectorLabels" (dict "context" . "component" "keycloak-postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.keycloakPostgres.service.port }}
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: {{ .Values.namespaces.data }}
  labels:
    {{- include "swiftdrop-data.componentLabels" (dict "context" . "component" "keycloak-postgres") | nindent 4 }}
spec:
  serviceName: keycloak-postgres
  replicas: {{ .Values.keycloakPostgres.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "swiftdrop-data.selectorLabels" (dict "context" . "component" "keycloak-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop-data.componentLabels" (dict "context" . "component" "keycloak-postgres") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: "{{ .Values.keycloakPostgres.image.repository }}:{{ .Values.keycloakPostgres.image.tag }}"
          imagePullPolicy: {{ .Values.keycloakPostgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: keycloak_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloakPostgres.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloakPostgres.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.keycloakPostgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "swiftdrop-data.componentLabels" (dict "context" . "component" "keycloak-postgres") | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.keycloakPostgres.storage.accessMode }}
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.keycloakPostgres.storage.size }}
{{- end }}

