# ==============================================================================
# SwiftDrop Platform — Data Layer Base Helm Values (Issue #154)
# Persistent, service-owned PostgreSQL StatefulSets in swiftdrop-data.
# Strict $0 cost policy: Local k3d/K3s local-path persistent storage.
# ==============================================================================

global:
  clusterDomain: cluster.local
  storageClass: local-path

namespaces:
  data: swiftdrop-data

accountsPostgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 2Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  secretName: accounts-db-credentials

businessPostgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 3Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 80m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  secretName: business-db-credentials

keycloakPostgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  storage:
    size: 2Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  secretName: keycloak-db-credentials

