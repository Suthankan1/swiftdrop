# ==============================================================================
# SwiftDrop Platform — Least-Privilege ServiceAccounts (Issue #149)
# All business microservices disable automatic API token mounting.
# No cluster-admin, no broad Secret listing, zero Kubernetes API mutation grants.
# ==============================================================================

{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftdrop-frontend-sa
  namespace: {{ .Values.namespaces.apps }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

