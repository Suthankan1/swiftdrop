{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-keycloak-config
  namespace: {{ .Values.namespaces.identity }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
data:
  KC_DB: {{ .Values.keycloak.config.db | quote }}
  KC_DB_URL: {{ .Values.keycloak.config.dbUrl | quote }}
  KC_HOSTNAME: {{ .Values.keycloak.config.hostname | quote }}
  KC_HTTP_PORT: {{ .Values.keycloak.config.httpPort | quote }}
  KC_PROXY_HEADERS: {{ .Values.keycloak.config.proxyHeaders | quote }}
  JAVA_OPTS_APPEND: {{ .Values.keycloak.config.javaOptsAppend | quote }}
{{- end }}
