# ==============================================================================
# SwiftDrop Platform — Externalized Non-Secret ConfigMaps (Issue #149)
# Contains only non-secret endpoint URLs, ports, hostnames, and JVM options.
# Zero passwords, tokens, API keys, or certificates are permitted in ConfigMaps.
# ==============================================================================

{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-gateway-config
  namespace: {{ .Values.namespaces.apps }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "api-gateway") | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.apiGateway.config.serverPort | quote }}
  KEYCLOAK_ISSUER_URI: {{ .Values.apiGateway.config.keycloakIssuerUri | quote }}
  KEYCLOAK_JWKS_URI: {{ .Values.apiGateway.config.keycloakJwksUri | quote }}
  JWT_AUDIENCE: {{ .Values.apiGateway.config.jwtAudience | quote }}
  ACCOUNTS_SERVICE_URL: {{ .Values.apiGateway.config.accountsServiceUrl | quote }}
  PRICING_SERVICE_URL: {{ .Values.apiGateway.config.pricingServiceUrl | quote }}
  DELIVERY_SERVICE_URL: {{ .Values.apiGateway.config.deliveryServiceUrl | quote }}
  COMMUNICATIONS_SERVICE_URL: {{ .Values.apiGateway.config.communicationsServiceUrl | quote }}
  GRAPHQL_SERVICE_URL: {{ .Values.apiGateway.config.graphqlServiceUrl | quote }}
  CORS_ALLOWED_ORIGIN: {{ .Values.apiGateway.config.corsAllowedOrigin | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.apiGateway.config.javaToolOptions | quote }}
{{- end }}

