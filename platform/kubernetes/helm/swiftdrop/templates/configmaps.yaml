  KEYCLOAK_JWKS_URI: {{ .Values.accounts.config.keycloakJwksUri | quote }}
  JWT_AUDIENCE: {{ .Values.accounts.config.jwtAudience | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.accounts.config.javaToolOptions | quote }}
{{- end }}

