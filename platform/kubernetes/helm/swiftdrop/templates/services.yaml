# ==============================================================================
# SwiftDrop Platform — Private Internal ClusterIP Services (Issue #149)
# All microservices and identity providers expose only private ClusterIP services.
# No LoadBalancer, NodePort, or externalIPs are permitted.
# ==============================================================================

{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespaces.apps }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "swiftdrop.selectorLabels" (dict "context" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      protocol: TCP
{{- end }}

{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
