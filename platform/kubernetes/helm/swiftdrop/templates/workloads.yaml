{{- if .Values.keycloak.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespaces.identity }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" (dict "context" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop.componentLabels" (dict "context" . "component" "keycloak") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: swiftdrop-keycloak-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ include "swiftdrop.image" .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            {{- toYaml .Values.keycloak.args | nindent 12 }}
          securityContext:
            {{- toYaml .Values.keycloak.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: swiftdrop-keycloak-config
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.adminSecretName }}
                  key: {{ .Values.keycloak.secretRefs.adminUsernameKey }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.adminSecretName }}
                  key: {{ .Values.keycloak.secretRefs.adminPasswordKey }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.dbSecretName }}
                  key: {{ .Values.keycloak.secretRefs.dbUsernameKey }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.dbSecretName }}
                  key: {{ .Values.keycloak.secretRefs.dbPasswordKey }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.googleSecretName }}
                  key: {{ .Values.keycloak.secretRefs.googleClientIdKey }}
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.googleSecretName }}
                  key: {{ .Values.keycloak.secretRefs.googleClientSecretKey }}
