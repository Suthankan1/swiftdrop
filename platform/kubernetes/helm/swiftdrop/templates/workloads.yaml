              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.smtpSecretName }}
                  key: {{ .Values.keycloak.secretRefs.smtpFromKey }}
                  optional: true
            - name: SMTP_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.smtpSecretName }}
                  key: {{ .Values.keycloak.secretRefs.smtpAuthKey }}
                  optional: true
            - name: SMTP_SSL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.smtpSecretName }}
                  key: {{ .Values.keycloak.secretRefs.smtpSslKey }}
                  optional: true
            - name: SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secretRefs.smtpSecretName }}
                  key: {{ .Values.keycloak.secretRefs.smtpStarttlsKey }}
                  optional: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.keycloak.probes.readiness.path }}
              port: {{ .Values.keycloak.probes.readiness.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 50
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.keycloak.probes.liveness.path }}
              port: {{ .Values.keycloak.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.keycloak.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.keycloak.probes.readiness.path }}
              port: {{ .Values.keycloak.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.keycloak.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.probes.readiness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/realm-swiftdrop.json
              subPath: realm-swiftdrop.json
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: swiftdrop-keycloak-realm
{{- end }}
