# ==============================================================================
# SwiftDrop Platform — PodDisruptionBudgets (Issue #154)
# Realistic disruption budgets for local single-node and multi-replica topologies.
# For single-replica workloads, maxUnavailable: 1 allows voluntary maintenance/drain.
# For multi-replica workloads (e.g. Delivery), minAvailable: 1 guarantees continuous availability.
# ==============================================================================

{{- if .Values.frontend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-budget
  namespace: {{ .Values.namespaces.apps }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" (dict "context" . "component" "frontend") | nindent 6 }}
{{- end }}

