{{- if .Values.delivery.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delivery-budget
  namespace: {{ .Values.namespaces.apps }}
  labels:
    {{- include "swiftdrop.componentLabels" (dict "context" . "component" "delivery-service") | nindent 4 }}
spec:
  {{- if gt (int .Values.delivery.replicaCount) 1 }}
  minAvailable: 1
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" (dict "context" . "component" "delivery-service") | nindent 6 }}
{{- end }}

