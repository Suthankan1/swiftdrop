# ==============================================================================
# SwiftDrop Platform — Base Helm Chart Values (Issue #149 / ADR-0011)
# Pinned immutable OCI image digests from Issue #128.
# Strict $0 cost policy: zero Azure resources, all workloads target local k3d/K3s.
# ==============================================================================

global:
  clusterDomain: cluster.local
  imagePullSecrets: []

namespaces:
  apps: swiftdrop-apps
  identity: swiftdrop-identity
  data: swiftdrop-data
  messaging: swiftdrop-messaging
  system: swiftdrop-system

# Ingress Configuration (Reuses embedded K3s Traefik controller)
ingress:
  enabled: true
  className: traefik
  host: swiftdrop.local
  subdomains:
    enabled: true
    app: app.swiftdrop.local
    api: api.swiftdrop.local
    auth: auth.swiftdrop.local
  tls:
    enabled: true
    secretName: swiftdrop-tls-cert
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

# NetworkPolicy Isolation Configuration
networkPolicies:
  enabled: true
  defaultDeny: true

# ------------------------------------------------------------------------------
# 1. Frontend React SPA
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/suthankan1/swiftdrop-frontend
    tag: b8ac497
    digest: sha256:778ce75418fcf9eca3135afec8bd58b77be747d3f38534aca6bbbf6b9aeac1dc
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 2. Spring Cloud API Gateway
# ------------------------------------------------------------------------------
apiGateway:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/suthankan1/swiftdrop-api-gateway
    tag: b8ac497
    digest: sha256:b42c2dcd199aaedbe4a5cb8c34198a02fe19de452c0a1b9e2c53ed3decf060a5
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 5
  config:
    serverPort: 8080
    keycloakIssuerUri: https://swiftdrop.local:18443/realms/swiftdrop
    keycloakJwksUri: http://keycloak.swiftdrop-identity.svc.cluster.local:8080/realms/swiftdrop/protocol/openid-connect/certs
    jwtAudience: swiftdrop-api
    accountsServiceUrl: http://accounts-service.swiftdrop-apps.svc.cluster.local:8081
    pricingServiceUrl: http://pricing-service.swiftdrop-apps.svc.cluster.local:8082
    deliveryServiceUrl: http://delivery-service.swiftdrop-apps.svc.cluster.local:8083
    communicationsServiceUrl: http://communications-service.swiftdrop-apps.svc.cluster.local:8084
    graphqlServiceUrl: http://graphql-query-service.swiftdrop-apps.svc.cluster.local:8085
    corsAllowedOrigin: "https://swiftdrop.local:18443,http://localhost:5173,http://localhost:3000"
    javaToolOptions: "-XX:+UseContainerSupport -Xms96m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -Xss512k"

