  service:
    type: ClusterIP
    httpPort: 8081
    grpcPort: 9081
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 15
      periodSeconds: 5
  config:
    serverPort: 8081
    grpcPort: 9081
    dbUrl: jdbc:postgresql://accounts-postgres.swiftdrop-data.svc.cluster.local:5432/accounts_db
    keycloakIssuerUri: https://swiftdrop.local:18443/realms/swiftdrop
    keycloakJwksUri: http://keycloak.swiftdrop-identity.svc.cluster.local:8080/realms/swiftdrop/protocol/openid-connect/certs
    jwtAudience: swiftdrop-api
    javaToolOptions: "-XX:+UseContainerSupport -Xms96m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -Xss512k"
