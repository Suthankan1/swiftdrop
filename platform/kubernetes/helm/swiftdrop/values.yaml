# ------------------------------------------------------------------------------
# 8. Keycloak Identity Provider (in swiftdrop-identity namespace)
# ------------------------------------------------------------------------------
keycloak:
  enabled: true
  namespace: swiftdrop-identity
  replicaCount: 1
  image:
    repository: ghcr.io/suthankan1/swiftdrop-keycloak
    tag: b8ac497
    digest: sha256:75effccfc0bf90a2947bbc9dee322ad7a644ea26477e655a5f0e9d5895cd8501
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    managementPort: 9000
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /health/live
      port: 9000
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /health/ready
      port: 9000
      initialDelaySeconds: 25
      periodSeconds: 10
  config:
    db: postgres
    dbUrl: jdbc:postgresql://keycloak-postgres.swiftdrop-data.svc.cluster.local:5432/keycloak_db
    hostname: https://swiftdrop.local:18443
    httpPort: 8080
    managementPort: 9000
    proxyHeaders: xforwarded
    javaOptsAppend: "-Dkeycloak.migration.replace-placeholders=true -Xms192m -Xmx384m"
  secretRefs:
    adminSecretName: keycloak-admin-secret
    adminUsernameKey: admin-username
    adminPasswordKey: admin-password
    dbSecretName: keycloak-db-secret
    dbUsernameKey: username
    dbPasswordKey: password
    googleSecretName: swiftdrop-google-oidc-secret
    googleClientIdKey: client-id
    googleClientSecretKey: client-secret

