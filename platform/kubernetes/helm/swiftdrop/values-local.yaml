# ==============================================================================
# SwiftDrop Platform — Local Development Helm Values (Issue #149 / #154)
# Environment: k3d-swiftdrop-local (Single-node K3s v1.31.2, Apple Silicon ARM64)
# Allocatable Docker RAM: 4.06 GiB. Conservative JVM memory footprints.
# Delivery scaled to 2 replicas for Issue #161 test handoff.
# ==============================================================================

global:
  clusterDomain: cluster.local

namespaces:
  apps: swiftdrop-apps
  identity: swiftdrop-identity
  data: swiftdrop-data
  messaging: swiftdrop-messaging
  system: swiftdrop-system

ingress:
  enabled: true
  className: traefik
  host: swiftdrop.local
  subdomains:
    enabled: true
    app: app.swiftdrop.local
    api: api.swiftdrop.local
    auth: auth.swiftdrop.local
  tls:
    enabled: true
    secretName: swiftdrop-tls-cert
  keycloak:
    exposeAdmin: true

networkPolicies:
  enabled: true
  defaultDeny: true

frontend:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 30m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 96Mi

apiGateway:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"

accounts:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"

pricing:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"

delivery:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"

communications:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"

graphql:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 80m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  config:
    accountsGrpcTarget: ""
    deliveryGrpcTarget: ""
    javaToolOptions: "-XX:+UseContainerSupport -Xms64m -Xmx192m -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=32m -Xss512k"

keycloak:
  enabled: true
  replicaCount: 1
  args:
    - "start"
    - "--http-enabled=true"
    - "--import-realm"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  config:
    javaOptsAppend: "-Dkeycloak.migration.replace-placeholders=true -Xms128m -Xmx512m"

statefulInterfaces:
  createPlaceholderServices: false
