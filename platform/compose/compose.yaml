# ==============================================================================
# SwiftDrop Platform — Full-Stack Persistent Compose Runtime (Issue #141)
# Connects the eight approved application/identity images with existing
# service-owned databases, Kafka, private MinIO, and local Mailpit receiver.
# Reuses platform/dependencies/docker-compose.dependencies.yml without resetting state.
# ==============================================================================

name: swiftdrop

include:
  - path: ../dependencies/docker-compose.dependencies.yml

services:
  # ----------------------------------------------------------------------------
  # Dedicated Accounts PostgreSQL Database (accounts_db)
  # ----------------------------------------------------------------------------
  accounts-postgres:
    image: postgres:16-alpine
    container_name: ${ACCOUNTS_DB_CONTAINER_NAME:-swiftdrop-accounts-postgres}
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: ${ACCOUNTS_DB_USERNAME:-accounts_app}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set ACCOUNTS_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
    ports:
      - "127.0.0.1:${ACCOUNTS_DB_PORT:-5438}:5432"
    volumes:
      - swiftdrop-accounts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USERNAME:-accounts_app} -d accounts_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - dependencies-net

  # ----------------------------------------------------------------------------
  # Dedicated Keycloak PostgreSQL Database (keycloak_db)
  # ----------------------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: ${KEYCLOAK_DB_CONTAINER_NAME:-swiftdrop-keycloak-postgres}
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
    ports:
      - "127.0.0.1:${KEYCLOAK_DB_PORT:-5437}:5432"
    volumes:
      - swiftdrop-keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d keycloak_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - dependencies-net

  # ----------------------------------------------------------------------------
  # Local Capture-Only Test Mail Receiver (Mailpit)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: ${MAILPIT_CONTAINER_NAME:-swiftdrop-mailpit}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 100
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - dependencies-net

  # ----------------------------------------------------------------------------
  # 1. Keycloak Identity Provider (Themed Image #128)
  # ----------------------------------------------------------------------------
  keycloak:
    image: ghcr.io/suthankan1/swiftdrop-keycloak:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: platform/identity/Dockerfile
    container_name: ${KEYCLOAK_CONTAINER_NAME:-swiftdrop-keycloak}
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:-jdbc:postgresql://keycloak-postgres:5432/keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8090}
      KC_HTTP_PORT: 8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true -Xms192m -Xmx384m"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COMMUNICATIONS_CLIENT_SECRET: ${COMMUNICATIONS_CLIENT_SECRET:?set COMMUNICATIONS_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      GRAPHQL_CLIENT_SECRET: ${GRAPHQL_CLIENT_SECRET:?set GRAPHQL_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      DELIVERY_CLIENT_SECRET: ${DELIVERY_CLIENT_SECRET:?set DELIVERY_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ../identity/realm-swiftdrop.json:/opt/keycloak/data/import/realm-swiftdrop.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dependencies-net
      - app-net

  # ----------------------------------------------------------------------------
  # One-shot local CA and certificate for internal gRPC TLS (kept in a volume, never committed)
  # ----------------------------------------------------------------------------
  grpc-certs:
    image: apache/kafka:4.2.1
    container_name: ${GRPC_CERTS_CONTAINER_NAME:-swiftdrop-grpc-certs}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cd /tls
        if [ -s server.crt ] && [ -s server.key ] && [ -s ca.crt ]; then echo "gRPC TLS material present"; exit 0; fi
        openssl req -x509 -newkey rsa:3072 -nodes -days 825 -subj "/CN=SwiftDrop local gRPC CA" \
          -keyout ca.key -out ca.crt
        printf 'subjectAltName=DNS:accounts-service,DNS:pricing-service,DNS:delivery-service,DNS:localhost\nextendedKeyUsage=serverAuth\n' > ext.cnf
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out server.key
        openssl req -new -key server.key -subj "/CN=swiftdrop-internal-grpc" -out server.csr
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 -extfile ext.cnf -out server.crt
        rm -f server.csr ext.cnf ca.key ca.srl
        # Services run as uid 10001; the key is readable only inside this private volume.
        chown 10001:10001 server.key server.crt ca.crt
        chmod 400 server.key
        chmod 444 server.crt ca.crt
    volumes:
      - swiftdrop-grpc-tls:/tls
    # Generates files only; it needs no network access.
    network_mode: none
    restart: "no"

  # ----------------------------------------------------------------------------
  # 2. Accounts & Partners Service (#128 Image)
  # ----------------------------------------------------------------------------
  accounts-service:
    image: ghcr.io/suthankan1/swiftdrop-accounts:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/accounts-service/Dockerfile
    container_name: swiftdrop-accounts-service
    environment:
      SWIFTDROP_GRPC_TLS_ENABLED: "true"
      SWIFTDROP_GRPC_TLS_CERT: /etc/swiftdrop/grpc-tls/server.crt
      SWIFTDROP_GRPC_TLS_KEY: /etc/swiftdrop/grpc-tls/server.key
      SWIFTDROP_GRPC_TLS_CA: /etc/swiftdrop/grpc-tls/ca.crt
      SERVER_PORT: 8081
      ACCOUNTS_GRPC_PORT: 9081
      ACCOUNTS_DB_URL: ${ACCOUNTS_DB_URL:-jdbc:postgresql://accounts-postgres:5432/accounts_db}
      ACCOUNTS_DB_USERNAME: ${ACCOUNTS_DB_USERNAME:-accounts_app}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set ACCOUNTS_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      SWIFTDROP_KEYCLOAK_ADMIN_SERVERURL: http://keycloak:8080
      SWIFTDROP_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      SWIFTDROP_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    volumes:
      - swiftdrop-grpc-tls:/etc/swiftdrop/grpc-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      accounts-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dependencies-net
      - app-net

  # ----------------------------------------------------------------------------
  # 3. Pricing & Zones Service (#128 Image)
  # ----------------------------------------------------------------------------
  pricing-service:
    image: ghcr.io/suthankan1/swiftdrop-pricing:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/pricing-service/Dockerfile
    container_name: swiftdrop-pricing-service
    environment:
      SWIFTDROP_GRPC_TLS_ENABLED: "true"
      SWIFTDROP_GRPC_TLS_CERT: /etc/swiftdrop/grpc-tls/server.crt
      SWIFTDROP_GRPC_TLS_KEY: /etc/swiftdrop/grpc-tls/server.key
      SWIFTDROP_GRPC_TLS_CA: /etc/swiftdrop/grpc-tls/ca.crt
      SERVER_PORT: 8082
      PRICING_GRPC_PORT: 9083
      PRICING_DB_URL: ${PRICING_DB_URL:-jdbc:postgresql://business-postgres:5432/pricing_db}
      PRICING_DB_USERNAME: ${PRICING_DB_USERNAME:-pricing_app}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:?set PRICING_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    volumes:
      - swiftdrop-grpc-tls:/etc/swiftdrop/grpc-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      business-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dependencies-net
      - app-net

  # ----------------------------------------------------------------------------
  # 4. Delivery Operations Service (#128 Image)
  # ----------------------------------------------------------------------------
  delivery-service:
    image: ghcr.io/suthankan1/swiftdrop-delivery:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/delivery-service/Dockerfile
    container_name: swiftdrop-delivery-service
    environment:
      SWIFTDROP_GRPC_TLS_ENABLED: "true"
      SWIFTDROP_GRPC_TLS_CERT: /etc/swiftdrop/grpc-tls/server.crt
      SWIFTDROP_GRPC_TLS_KEY: /etc/swiftdrop/grpc-tls/server.key
      SWIFTDROP_GRPC_TLS_CA: /etc/swiftdrop/grpc-tls/ca.crt
      SERVER_PORT: 8083
      DELIVERY_GRPC_PORT: 9082
      DELIVERY_DB_URL: ${DELIVERY_DB_URL:-jdbc:postgresql://business-postgres:5432/delivery_db}
      DELIVERY_DB_USERNAME: ${DELIVERY_DB_USERNAME:-delivery_app}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?set DELIVERY_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      SWIFTDROP_STORAGE_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      SWIFTDROP_STORAGE_BUCKET: ${SWIFTDROP_STORAGE_BUCKET:-swiftdrop-pod}
      SWIFTDROP_STORAGE_REGION: us-east-1
      SWIFTDROP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-swiftdrop_storage_admin}
      SWIFTDROP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      PRICING_GRPC_HOST: pricing-service
      PRICING_GRPC_PORT: 9083
      ACCOUNTS_GRPC_HOST: accounts-service
      ACCOUNTS_GRPC_PORT: 9081
      ACCOUNTS_GRPC_DEADLINE_MS: "10000"
      SWIFTDROP_DELIVERY_CLIENT_SECRET: ${DELIVERY_CLIENT_SECRET:?set DELIVERY_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    volumes:
      - swiftdrop-grpc-tls:/etc/swiftdrop/grpc-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      business-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dependencies-net
      - app-net

  # ----------------------------------------------------------------------------
  # 5. Communications Service (#128 Image)
  # ----------------------------------------------------------------------------
  communications-service:
    image: ghcr.io/suthankan1/swiftdrop-communications:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/communications-service/Dockerfile
    container_name: swiftdrop-communications-service
    environment:
      SWIFTDROP_GRPC_TLS_ENABLED: "true"
      SWIFTDROP_GRPC_TLS_CERT: /etc/swiftdrop/grpc-tls/server.crt
      SWIFTDROP_GRPC_TLS_KEY: /etc/swiftdrop/grpc-tls/server.key
      SWIFTDROP_GRPC_TLS_CA: /etc/swiftdrop/grpc-tls/ca.crt
      SERVER_PORT: 8084
      COMMUNICATIONS_DB_URL: ${COMMUNICATIONS_DB_URL:-jdbc:postgresql://business-postgres:5432/communications_db}
      COMMUNICATIONS_DB_USERNAME: ${COMMUNICATIONS_DB_USERNAME:-communications_app}
      COMMUNICATIONS_DB_PASSWORD: ${COMMUNICATIONS_DB_PASSWORD:?set COMMUNICATIONS_DB_PASSWORD in platform/compose/.env (run start.sh or copy .env.example)}
      ACCOUNTS_GRPC_HOST: accounts-service
      ACCOUNTS_GRPC_PORT: 9081
      DELIVERY_GRPC_HOST: delivery-service
      DELIVERY_GRPC_PORT: 9082
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      SWIFTDROP_COMMUNICATIONS_CLIENT_SECRET: ${COMMUNICATIONS_CLIENT_SECRET:?set COMMUNICATIONS_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      # Required: encrypts stored webhook signing secrets. start.sh generates one in .env.
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY (64 hex characters); start.sh generates one}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    volumes:
      - swiftdrop-grpc-tls:/etc/swiftdrop/grpc-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      business-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dependencies-net
      - app-net

  # ----------------------------------------------------------------------------
  # 6. GraphQL Query API (#128 Image)
  # ----------------------------------------------------------------------------
  graphql-query-service:
    image: ghcr.io/suthankan1/swiftdrop-graphql:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/graphql-query-service/Dockerfile
    container_name: swiftdrop-graphql-query-service
    environment:
      SWIFTDROP_GRPC_TLS_ENABLED: "true"
      SWIFTDROP_GRPC_TLS_CERT: /etc/swiftdrop/grpc-tls/server.crt
      SWIFTDROP_GRPC_TLS_KEY: /etc/swiftdrop/grpc-tls/server.key
      SWIFTDROP_GRPC_TLS_CA: /etc/swiftdrop/grpc-tls/ca.crt
      GRAPHQL_SERVER_PORT: 8085
      SWIFTDROP_GRPC_ACCOUNTS_TARGET: accounts-service:9081
      SWIFTDROP_GRPC_DELIVERY_TARGET: delivery-service:9082
      SWIFTDROP_GRPC_DEADLINE_MS: "10000"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      SWIFTDROP_GRAPHQL_CLIENT_SECRET: ${GRAPHQL_CLIENT_SECRET:?set GRAPHQL_CLIENT_SECRET in platform/compose/.env (run start.sh or copy .env.example)}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    volumes:
      - swiftdrop-grpc-tls:/etc/swiftdrop/grpc-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  # ----------------------------------------------------------------------------
  # 6b. AI delivery assistant (optional; disabled until GEMINI_API_KEY is set)
  # ----------------------------------------------------------------------------
  ai-assistant:
    image: ghcr.io/suthankan1/swiftdrop-ai-assistant:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: ai-assistant/Dockerfile
    container_name: swiftdrop-ai-assistant
    environment:
      SERVER_PORT: 8086
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PRICING_SERVICE_URL: http://pricing-service:8082
      DELIVERY_SERVICE_URL: http://delivery-service:8083
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms64m -Xmx160m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # Reaches Pricing, Delivery and Keycloak (signing keys); outbound internet for the Gemini API.
      - app-net

  # ----------------------------------------------------------------------------
  # 7. Spring Cloud API Gateway (#128 Image)
  # ----------------------------------------------------------------------------
  api-gateway:
    image: ghcr.io/suthankan1/swiftdrop-api-gateway:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: swiftdrop-api-gateway
    environment:
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/swiftdrop}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/swiftdrop/protocol/openid-connect/certs
      JWT_AUDIENCE: swiftdrop-api
      ACCOUNTS_SERVICE_URL: http://accounts-service:8081
      PRICING_SERVICE_URL: http://pricing-service:8082
      DELIVERY_SERVICE_URL: http://delivery-service:8083
      COMMUNICATIONS_SERVICE_URL: http://communications-service:8084
      GRAPHQL_SERVICE_URL: http://graphql-query-service:8085
      AI_ASSISTANT_URL: http://ai-assistant:8086
      GATEWAY_CONNECT_TIMEOUT_MS: "10000"
      GATEWAY_RESPONSE_TIMEOUT: "30s"
      SWIFTDROP_GATEWAY_MERCHANT_KEYS_DELEGATE_TO_SERVICE: "true"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -Xms96m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      accounts-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      communications-service:
        condition: service_healthy
      graphql-query-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  # ----------------------------------------------------------------------------
  # 8. React Single Page Application (#128 Image)
  # ----------------------------------------------------------------------------
  frontend:
    image: ghcr.io/suthankan1/swiftdrop-frontend:${SWIFTDROP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: swiftdrop-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    name: swiftdrop-app-net
    driver: bridge

volumes:
  swiftdrop-accounts-postgres-data:
    name: ${ACCOUNTS_DB_VOLUME:-swiftdrop-accounts-postgres-data}
  swiftdrop-keycloak-postgres-data:
    name: ${KEYCLOAK_DB_VOLUME:-swiftdrop-keycloak-postgres-data}
  swiftdrop-grpc-tls:
    name: swiftdrop-grpc-tls
