# ==============================================================================
# SwiftDrop Platform — Identity Service Isolated Compose (Issue #2)
# Runs Keycloak 26.8.1 on port 8090 with automated realm import.
# Reads runtime configuration from .env (injected outside Git).
# ==============================================================================

services:
  # Capture-only development SMTP. No relay, real delivery, or host SMTP port.
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: devarom-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 100

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: devarom-keycloak
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8090}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD must be explicitly set and non-empty in local .env}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./realm-swiftdrop.json:/opt/keycloak/data/import/realm-swiftdrop.json:ro
      - ./themes:/opt/keycloak/themes:ro
