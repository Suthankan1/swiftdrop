name: SwiftDrop CI

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --dir frontend lint

      - name: Run TypeScript typecheck
        run: pnpm --dir frontend typecheck

      - name: Run Vitest unit & component tests
        run: pnpm --dir frontend test --run

      - name: Build frontend production bundle
        run: pnpm --dir frontend build

      - name: Verify build artifacts
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          echo "Frontend production assets built successfully."

      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  java-services:
    name: Java 21 Services Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 LTS
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Discover and verify Spring Boot microservices
        run: |
          echo "================================================================================"
          echo "                  SWIFTDROP JAVA SERVICE BUILD & VERIFY GATE                    "
          echo "================================================================================"
          
          SERVICES_DIR="services"
          FAILED_SERVICES=()
          VERIFIED_SERVICES=()
          NOT_IMPLEMENTED=()
          
          for service_dir in "$SERVICES_DIR"/*; do
            if [ -d "$service_dir" ]; then
              service_name=$(basename "$service_dir")
              if [ -f "$service_dir/pom.xml" ] && [ -f "$service_dir/mvnw" ]; then
                echo ""
                echo "--------------------------------------------------------------------------------"
                echo "BUILDING & VERIFYING: $service_name"
                echo "--------------------------------------------------------------------------------"
                chmod +x "$service_dir/mvnw"
                if (cd "$service_dir" && ./mvnw -B clean verify); then
                  echo "✓ $service_name build and verification SUCCEEDED."
                  VERIFIED_SERVICES+=("$service_name")
                else
                  echo "✗ $service_name build/test FAILED."
                  FAILED_SERVICES+=("$service_name")
                fi
              else
                echo "ℹ [SERVICE STATUS] $service_name: NOT YET IMPLEMENTED (Design placeholder only, skipping build)"
                NOT_IMPLEMENTED+=("$service_name")
              fi
            fi
          done
          
          echo ""
          echo "================================================================================"
          echo "JAVA SERVICE SUMMARY"
          echo "Verified services:    ${VERIFIED_SERVICES[*]:-None}"
          echo "Pending services:     ${NOT_IMPLEMENTED[*]:-None}"
          echo "Failed services:      ${FAILED_SERVICES[*]:-None}"
          echo "================================================================================"
          
          if [ ${#FAILED_SERVICES[@]} -gt 0 ]; then
            echo "ERROR: One or more implemented Java services failed verification!"
            exit 1
          fi
          
          if [ ${#VERIFIED_SERVICES[@]} -eq 0 ]; then
            echo "ERROR: No active Java services were verified!"
            exit 1
          fi

      - name: Collect Surefire & Failsafe test reports
        if: always()
        run: |
          mkdir -p test-reports
          find services -type d \( -name "surefire-reports" -o -name "failsafe-reports" \) -exec cp -r {} test-reports/ \; 2>/dev/null || true

      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: java-test-reports
          path: test-reports
          retention-days: 7
