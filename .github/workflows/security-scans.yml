name: SwiftDrop Security Quality Gates

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.21.0

      - name: Run frontend dependency audit
        run: pnpm --dir frontend audit --audit-level=high

      - name: Run Trivy filesystem dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

  container-security:
    name: Container Security / ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
            tag: swiftdrop/frontend:ci-scan
            extra_trivy_args: ""
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
            tag: swiftdrop/api-gateway:ci-scan
            extra_trivy_args: ""
          - name: accounts-service
            dockerfile: services/accounts-service/Dockerfile
            context: .
            tag: swiftdrop/accounts:ci-scan
            extra_trivy_args: ""
          - name: pricing-service
            dockerfile: services/pricing-service/Dockerfile
            context: .
            tag: swiftdrop/pricing:ci-scan
            extra_trivy_args: ""
          - name: delivery-service
            dockerfile: services/delivery-service/Dockerfile
            context: .
            tag: swiftdrop/delivery:ci-scan
            extra_trivy_args: ""
          - name: communications-service
            dockerfile: services/communications-service/Dockerfile
            context: .
            tag: swiftdrop/communications:ci-scan
            extra_trivy_args: ""
          - name: graphql-query-service
            dockerfile: services/graphql-query-service/Dockerfile
            context: .
            tag: swiftdrop/graphql:ci-scan
            extra_trivy_args: ""
          - name: keycloak
            dockerfile: platform/identity/Dockerfile
            context: .
            tag: swiftdrop/keycloak:ci-scan
            extra_trivy_args: "--ignore-unfixed"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Dockerfile exists
        run: |
          test -f "${{ matrix.target.dockerfile }}" || {
            echo "ERROR: Dockerfile missing at ${{ matrix.target.dockerfile }}"
            exit 1
          }

      - name: Build container image
        run: |
          echo "Building ${{ matrix.target.name }} (${{ matrix.target.tag }}) using ${{ matrix.target.dockerfile }}..."
          docker build -f "${{ matrix.target.dockerfile }}" -t "${{ matrix.target.tag }}" "${{ matrix.target.context }}"

      - name: Scan container image with Trivy
        run: |
          echo "Scanning ${{ matrix.target.tag }} for HIGH and CRITICAL vulnerabilities..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.59.1 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ matrix.target.extra_trivy_args }} \
            "${{ matrix.target.tag }}"
          echo "✓ Image ${{ matrix.target.tag }} passed vulnerability scan gate."
