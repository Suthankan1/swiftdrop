name: SwiftDrop Security Quality Gates

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.21.0

      - name: Run frontend dependency audit
        run: pnpm --dir frontend audit --audit-level=high

      - name: Run Trivy filesystem dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

  container-security:
    name: Container Security & Missing-Target Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Discover, build, and evaluate all 8 container targets
        run: |
          echo "================================================================================"
          echo "                  SWIFTDROP CONTAINER SECURITY QUALITY GATE                    "
          echo "================================================================================"

          TARGETS=(
            "frontend:frontend/Dockerfile:.:swiftdrop/frontend:ci-scan"
            "api-gateway:services/api-gateway/Dockerfile:.:swiftdrop/api-gateway:ci-scan"
            "accounts-service:services/accounts-service/Dockerfile:.:swiftdrop/accounts:ci-scan"
            "pricing-service:services/pricing-service/Dockerfile:.:swiftdrop/pricing:ci-scan"
            "delivery-service:services/delivery-service/Dockerfile:.:swiftdrop/delivery:ci-scan"
            "communications-service:services/communications-service/Dockerfile:.:swiftdrop/communications:ci-scan"
            "graphql-query-service:services/graphql-query-service/Dockerfile:.:swiftdrop/graphql:ci-scan"
            "keycloak:platform/identity/Dockerfile:.:swiftdrop/keycloak:ci-scan"
          )

          TARGET_COUNT=${#TARGETS[@]}
          echo "Required runtime image count: 8"
          echo "Target definitions provided: $TARGET_COUNT"

          if [ "$TARGET_COUNT" -ne 8 ]; then
            echo "✗ Error: Expected exactly 8 approved container targets, found $TARGET_COUNT"
            exit 1
          fi

          for entry in "${TARGETS[@]}"; do
            IFS=':' read -r name df ctx tag <<< "$entry"
            if [ ! -f "$df" ]; then
              echo "✗ Error: Dockerfile for $name not found at $df"
              exit 1
            fi
            echo "--------------------------------------------------------------------------------"
            echo "Building $name using Dockerfile $df with context $ctx"
            echo "--------------------------------------------------------------------------------"
            docker build -f "$df" -t "$tag" "$ctx"
          done
          echo "✓ All 8 runtime container images successfully built."

      - name: Run container vulnerability scans with Trivy
        run: |
          echo "================================================================================"
          echo "              SWIFTDROP CONTAINER IMAGE VULNERABILITY AUDIT                     "
          echo "================================================================================"

          IMAGES=(
            "swiftdrop/frontend:ci-scan"
            "swiftdrop/api-gateway:ci-scan"
            "swiftdrop/accounts:ci-scan"
            "swiftdrop/pricing:ci-scan"
            "swiftdrop/delivery:ci-scan"
            "swiftdrop/communications:ci-scan"
            "swiftdrop/graphql:ci-scan"
            "swiftdrop/keycloak:ci-scan"
          )

          FAILURES=0
          for img in "${IMAGES[@]}"; do
            echo "Scanning image: $img"
            EXTRA_ARGS=""
            if [[ "$img" == *"keycloak"* ]]; then
              EXTRA_ARGS="--ignore-unfixed"
            fi
            if docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.59.1 image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              $EXTRA_ARGS \
              "$img"; then
              echo "✓ $img PASSED vulnerability scan"
            else
              echo "✗ $img FAILED vulnerability scan"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ $FAILURES -gt 0 ]; then
            echo "✗ Container vulnerability scan failed on $FAILURES image(s)."
            exit 1
          fi
          echo "✓ All 8 container images passed vulnerability scan gates with 0 High/Critical findings."
