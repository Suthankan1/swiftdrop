name: SwiftDrop CD — Azure VM Staging

on:
  workflow_run:
    workflows: ["SwiftDrop CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific image tag / commit SHA to deploy (defaults to latest main commit)'
        required: false
        default: ''

concurrency:
  group: cd-deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-to-azure:
    name: Deploy to Azure Staging VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy services via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST || '104.211.73.205' }}
          VM_USER: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CUSTOM_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "================================================================================"
            echo "ℹ Notice: AZURE_VM_SSH_KEY secret is not configured in GitHub repository."
            echo "To enable automated CD on merge to main:"
            echo "1. Go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "2. Add secret AZURE_VM_SSH_KEY containing the private key."
            echo "3. Add secret AZURE_VM_HOST (e.g. 104.211.73.205) and AZURE_VM_USER (azureuser)."
            echo "Continuous Deployment step will be skipped."
            echo "================================================================================"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          TAG_SHORT="${CUSTOM_TAG:-$(echo "${DEPLOY_SHA}" | cut -c1-7)}"
          echo "Connecting to ${VM_USER}@${VM_HOST} to deploy tag: ${TAG_SHORT} (commit ${DEPLOY_SHA})..."

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${VM_USER}@${VM_HOST}" bash -s -- "${DEPLOY_SHA}" "${TAG_SHORT}" << 'EOF'
            set -euo pipefail
            DEPLOY_SHA="$1"
            TAG_SHORT="$2"

            echo "Updating repository to ${DEPLOY_SHA} on Azure VM..."
            cd /home/azureuser/swiftdrop
            git fetch origin main
            git reset --hard "${DEPLOY_SHA}"

            echo "Configuring pre-built container image tag (${TAG_SHORT})..."
            cd /home/azureuser/swiftdrop/platform/compose

            if grep -q "^SWIFTDROP_IMAGE_TAG=" .env; then
              sed -i "s/^SWIFTDROP_IMAGE_TAG=.*/SWIFTDROP_IMAGE_TAG=${TAG_SHORT}/" .env
            else
              echo "SWIFTDROP_IMAGE_TAG=${TAG_SHORT}" >> .env
            fi

            echo "Pulling verified runtime images from GitHub Container Registry..."
            docker compose -f compose.yaml -f compose.supabase.yaml pull

            echo "Starting runtime containers..."
            ./start.sh
            ./status.sh
          EOF

          echo "✓ Successfully deployed version ${TAG_SHORT} to Azure Staging VM."
