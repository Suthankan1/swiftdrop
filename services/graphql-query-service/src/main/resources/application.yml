server:
  port: ${GRAPHQL_SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: graphql-query-service
  graphql:
    http:
      path: /graphql
    schema:
      file-extensions: .graphql
      introspection:
        enabled: false
    graphiql:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
