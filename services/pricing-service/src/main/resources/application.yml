server:
  port: 8082

grpc:
  server:
    port: ${PRICING_GRPC_PORT:9083}
    enabled: ${PRICING_GRPC_ENABLED:true}

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  application:
    name: pricing-service
  datasource:
    url: ${PRICING_DB_URL}
    username: ${PRICING_DB_USERNAME:pricing_app}
    password: ${PRICING_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:900000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${swiftdrop.jwt.issuer-uri:${devarom.jwt.issuer-uri:http://localhost:8090/realms/swiftdrop}}}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${swiftdrop.jwt.jwk-set-uri:${devarom.jwt.jwk-set-uri:http://localhost:8090/realms/swiftdrop/protocol/openid-connect/certs}}}
swiftdrop:
  jwt:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/swiftdrop}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8090/realms/swiftdrop/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:swiftdrop-api}
  pricing:
    quote-validity-seconds: ${QUOTE_VALIDITY_SECONDS:900}
    # Same Day (EXPRESS) surcharge as a percentage of the standard price.
    express-surcharge-percent: ${EXPRESS_SURCHARGE_PERCENT:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server.error:
  include-message: never
  include-stacktrace: never
  include-binding-errors: never
