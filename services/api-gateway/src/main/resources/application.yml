server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: communications-service-webhooks
              uri: ${COMMUNICATIONS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/merchants/webhooks, /api/v1/merchants/webhooks/**
              order: 5
            - id: accounts-service-users-me
              uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/me
              order: 10
            - id: accounts-service-merchants
              uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/merchants, /api/v1/merchants/**
              order: 10
            - id: accounts-service-admin
              uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/**
              order: 10
            - id: pricing-service-quotes
              uri: ${PRICING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/quotes, /api/v1/quotes/**
              order: 10
            - id: pricing-service-zones
              uri: ${PRICING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/zones, /api/v1/zones/**
              order: 10
            - id: delivery-service-tracking
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/tracking/**
              order: 10
              metadata:
                response-timeout: -1
            - id: delivery-service-merchant-parcels
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/merchant/parcels, /api/v1/merchant/parcels/**
              order: 10
            - id: delivery-service-assignments
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/assignments, /api/v1/assignments/**
              order: 10
            - id: delivery-service-parcels
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/parcels, /api/v1/parcels/**
              order: 10
              metadata:
                response-timeout: -1
            - id: graphql-query-service
              uri: ${GRAPHQL_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/graphql
              order: 10
      routes:
        - id: communications-service-webhooks
          uri: ${COMMUNICATIONS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/merchants/webhooks, /api/v1/merchants/webhooks/**
          order: 5
        - id: accounts-service-users-me
          uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/me
          order: 10
        - id: accounts-service-merchants
          uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/merchants, /api/v1/merchants/**
          order: 10
        - id: accounts-service-admin
          uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/**
          order: 10
        - id: pricing-service-quotes
          uri: ${PRICING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/quotes, /api/v1/quotes/**
          order: 10
        - id: pricing-service-zones
          uri: ${PRICING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/zones, /api/v1/zones/**
          order: 10
        - id: delivery-service-tracking
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/tracking/**
          order: 10
          metadata:
            response-timeout: -1
        - id: delivery-service-merchant-parcels
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/merchant/parcels, /api/v1/merchant/parcels/**
          order: 10
        - id: delivery-service-assignments
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/assignments, /api/v1/assignments/**
          order: 10
        - id: delivery-service-parcels
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/parcels, /api/v1/parcels/**
          order: 10
          metadata:
            response-timeout: -1
        - id: graphql-query-service
          uri: ${GRAPHQL_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/graphql
          order: 10
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - Idempotency-Key
            allow-credentials: true
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

devarom:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/swiftdrop}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8090/realms/swiftdrop/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:swiftdrop-api}

swiftdrop:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:${devarom.jwt.issuer-uri:http://localhost:8090/realms/swiftdrop}}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI:${devarom.jwt.jwk-set-uri:http://localhost:8090/realms/swiftdrop/protocol/openid-connect/certs}}
    audience: ${JWT_AUDIENCE:${devarom.jwt.audience:swiftdrop-api}}
  gateway:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      public-limit-per-minute: ${RATE_LIMIT_PUBLIC_PER_MIN:60}
      public-burst-capacity: ${RATE_LIMIT_PUBLIC_BURST:10}
      merchant-limit-per-minute: ${RATE_LIMIT_MERCHANT_PER_MIN:120}
      merchant-burst-capacity: ${RATE_LIMIT_MERCHANT_BURST:20}
      unauthenticated-limit-per-minute: ${RATE_LIMIT_UNAUTH_PER_MIN:10}
      unauthenticated-burst-capacity: ${RATE_LIMIT_UNAUTH_BURST:5}
    payload:
      enabled: ${PAYLOAD_LIMIT_ENABLED:true}
      max-quote-bytes: ${MAX_QUOTE_PAYLOAD_BYTES:65536} # 64 KB
      max-standard-bytes: ${MAX_STANDARD_PAYLOAD_BYTES:262144} # 256 KB
      max-proof-bytes: ${MAX_PROOF_PAYLOAD_BYTES:5242880} # 5 MB
    sse:
      enabled: ${SSE_POLICY_ENABLED:true}
      max-public-connections: ${SSE_MAX_PUBLIC_CONCURRENT:5}
      max-authenticated-connections: ${SSE_MAX_AUTH_CONCURRENT:10}
