<text x="75" y="860.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Guard for every transition: authenticated courier owns active assignment; expected version matches; input evidence meets the agreed stage policy.</text>
<text x="75" y="880.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">DELIVERED and FAILED are terminal for MVP. No cancellation or redelivery transition is invented; future redelivery needs an explicit attempt model.</text>
<text x="75" y="900.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Delivery proof may be recipient name / note / photo as agreed. The exact proof and receipt timing policy must be confirmed.</text>
