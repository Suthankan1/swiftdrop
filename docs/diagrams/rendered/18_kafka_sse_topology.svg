<text x="767.5" y="221.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#15324F" text-anchor="middle">Ack -&gt; mark published</text>
<text x="767.5" y="244.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#15324F" text-anchor="middle">Retry; duplicates allowed</text>
