<text x="1362.5" y="186.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">Kafka KRaft</text>
<text x="1362.5" y="209.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">parcel.lifecycle.v1 | key=parcelId</text>
<text x="1362.5" y="232.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">eventId + aggregateVersion + correlationId</text>
<text x="1362.5" y="255.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">Ordering within a partition; not global</text>
