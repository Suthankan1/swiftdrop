<text x="260.0" y="198.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">Delivery Operations</text>
<text x="260.0" y="221.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">Atomic status + history + OUTBOX</text>
<text x="260.0" y="244.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#15324F" text-anchor="middle">Authoritative PostgreSQL state</text>
