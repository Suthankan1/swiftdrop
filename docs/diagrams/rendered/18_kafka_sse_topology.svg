<text x="590.0" y="481.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">webhooks.v1</text>
<text x="590.0" y="502.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Inbox + durable jobs</text>
