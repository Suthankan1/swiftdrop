<text x="590.0" y="667.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Receiver deduplicates eventId</text>
<rect x="90" y="721" width="650" height="65" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="748.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Malformed / unprocessable event -&gt; event retry + DLQ review.</text>
<text x="95" y="767.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">External job failure -&gt; bounded durable retries, failed-job review. No exactly-once claim.</text>
<text x="867" y="401.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#15324F" text-anchor="start">DELIVERY TRACKING - replica fan-out target (separate from Nov 1 login build)</text>
<rect x="890" y="432" width="335" height="110" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="1057.5" y="461.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Delivery replica A</text>
<text x="1057.5" y="482.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Group: tracking.&lt;replica-A&gt;</text>
<text x="1057.5" y="503.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Consumes ALL topic partitions</text>
<text x="1057.5" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Authorized SSE connections</text>
<rect x="1270" y="432" width="335" height="110" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="1437.5" y="461.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Delivery replica B</text>
<text x="1437.5" y="482.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Group: tracking.&lt;replica-B&gt;</text>
<text x="1437.5" y="503.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Consumes ALL topic partitions</text>
<text x="1437.5" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Authorized SSE connections</text>
<rect x="1125" y="626" width="255" height="75" rx="8" fill="#E8F1FF" stroke="#52677C" stroke-width="1.5"/>
<text x="1252.5" y="658.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">Gateway / Ingress</text>
<text x="1252.5" y="679.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#15324F" text-anchor="middle">SSE routing + heartbeat</text>
<rect x="1068.9931640625" y="564" width="46.013671875" height="22" fill="white"/>
<text x="1092.0" y="579.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="middle">SSE</text>
<rect x="1426.9931640625" y="564" width="46.013671875" height="22" fill="white"/>
<text x="1450.0" y="579.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="middle">SSE</text>
<rect x="1050" y="880" width="405" height="75" rx="8" fill="#E8F1FF" stroke="#52677C" stroke-width="1.5"/>
<text x="1252.5" y="912.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#15324F" text-anchor="middle">React tracking client</text>
<text x="1252.5" y="935.5" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="normal" fill="#15324F" text-anchor="middle">Redacted state-only events</text>
<rect x="1188.54150390625" y="840" width="126.9169921875" height="22" fill="white"/>
<text x="1252.0" y="855.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="middle">SSE over HTTPS</text>
<rect x="65" y="868" width="805" height="105" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="70" y="895.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Each replica has a unique group, so every connection node receives each event.</text>
<text x="70" y="915.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">A single shared tracking group would load-balance events and miss clients.</text>
<text x="70" y="935.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Target must be proven with two replicas; clean up stale groups and size lag / load.</text>
<text x="70" y="955.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">One Delivery/SSE replica is the simpler non-HA full-flow demo starting point.</text>
<rect x="895" y="1007" width="740" height="100" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="900" y="1032.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Reconnect: canonical REST GET + latest state version; discard stale events.</text>
<text x="900" y="1052.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Fetch-based SSE supports Authorization header; never put JWT in URL.</text>
<text x="900" y="1072.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Rate-limit public tracking; redact addresses, phones and proof.</text>
<text x="900" y="1092.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Ingress: disable buffering, configure timeouts; heartbeats / backpressure.</text>
</svg>