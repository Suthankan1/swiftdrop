<text x="850.0" y="184.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#15324F" text-anchor="middle">Keycloak</text>
<rect x="1105.0" y="145" width="210" height="68" rx="8" fill="#EFEAFF" stroke="#52677C" stroke-width="1.5"/>
<text x="1210.0" y="184.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#15324F" text-anchor="middle">Google OIDC</text>
<rect x="1465.0" y="145" width="210" height="68" rx="8" fill="#E8F1FF" stroke="#52677C" stroke-width="1.5"/>
<text x="1570.0" y="184.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#15324F" text-anchor="middle">Gateway / Accounts</text>
<text x="310.0" y="247.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Select Login with Google</text>
<text x="670.0" y="283.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">/authorize: state, nonce, S256 challenge</text>
<text x="670.0" y="303.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Public client + registered redirect URI</text>
<text x="1030.0" y="339.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Broker OIDC authorization</text>
<text x="1030.0" y="359.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">via browser redirect</text>
<text x="670.0" y="415.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Authenticate / consent in Google UI</text>
<text x="670.0" y="471.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">User completes Google login</text>
<text x="1030.0" y="507.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Broker callback with Google code</text>
<text x="1030.0" y="527.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">via browser redirect</text>
<text x="1030.0" y="583.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Server-side code exchange / identity validation</text>
<text x="1030.0" y="639.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Validated identity result</text>
<text x="670.0" y="675.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Keycloak code + state callback</text>
<text x="670.0" y="695.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">via browser redirect</text>
<text x="670.0" y="751.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">/token: Keycloak code + PKCE verifier</text>
<text x="670.0" y="807.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Keycloak access JWT + OIDC ID token</text>
<text x="1030.0" y="863.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Bearer ACCESS token: profile bootstrap / read</text>
<text x="1030.0" y="899.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Validate issuer/audience/expiry/signature</text>
<text x="1030.0" y="919.0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="middle">Map sub -&gt; profile; role + ownership checks</text>
<rect x="90" y="963" width="1520" height="67" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="1001.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">React validates state; OIDC client checks nonce / ID-token claims. PKCE verifier is not sent in the authorization redirect. No client secret in SPA.</text>
<rect x="90" y="1045" width="1520" height="67" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="1083.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Keycloak assigns approved application roles; Google login must not grant courier / dispatcher / admin privileges. Secrets remain server-side.</text>
<rect x="90" y="1127" width="1520" height="67" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="1165.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">API accepts Keycloak access tokens, not Google ID tokens. Handle cancellation / expiry; tokens kept out of URLs and logs. Google provider setup is planned, not verified.</text>
</svg>