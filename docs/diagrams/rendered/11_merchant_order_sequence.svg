<text x="95" y="997.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">OAuth 2.0 client credentials is an assignment-permitted alternate, deferred from this API-key MVP. Webhook subscription must be configured separately.</text>
