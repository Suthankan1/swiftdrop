<text x="95" y="833.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Accounts stores only credential hash / metadata. Internal calls use authenticated service identity and verified delegated tenant context.</text>
