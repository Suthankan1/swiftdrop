<text x="95" y="915.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">401 invalid credential; 403 unapproved / insufficient scope; 409 key reused with different payload. Duplicate same-key request returns original order.</text>
