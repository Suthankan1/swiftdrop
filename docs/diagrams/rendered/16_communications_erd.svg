<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="100%" height="100%" fill="white"/>
<rect x="40" y="140" width="1420" height="765" rx="8" fill="#F5F8FC" stroke="#B8C8D8" stroke-width="1.5"/>
<polyline points="95,240 580,240" fill="none" stroke="#AFC1CF" stroke-width="1.6"/>
<polyline points="900,240 1385,240" fill="none" stroke="#AFC1CF" stroke-width="1.6"/>
<polyline points="95,645 580,645" fill="none" stroke="#AFC1CF" stroke-width="1.6"/>
<polyline points="900,645 1385,645" fill="none" stroke="#AFC1CF" stroke-width="1.6"/>
<polyline points="580,287.0 900,299.0" fill="none" stroke="#52677C" stroke-width="1.6"/>
<text x="53" y="63.5" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15324F" text-anchor="start">Communications - logical ERD</text>
<text x="53" y="105.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#52677C" text-anchor="start">Service-owned notification / webhook data | Local FKs plus event and tenant references; no foreign service SQL access</text>
<text x="53" y="1049.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#52677C" text-anchor="start">PROPOSED DESIGN | Devarom v1.3 | Nov 1 milestone - not implementation evidence</text>
<text x="57" y="166.5" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#15324F" text-anchor="start">COMMUNICATIONS DATABASE</text>
<rect x="95" y="200" width="485" height="174" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="108" y="227.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#15324F" text-anchor="start">WEBHOOK_SUBSCRIPTIONS</text>
<text x="112" y="274.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">PK subscription_id</text>
<text x="112" y="293.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">EXT merchant_id</text>
<text x="112" y="312.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">https_url, allowed_event_types</text>
<text x="112" y="331.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">secret_ref (never plaintext in logs)</text>
<text x="112" y="350.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">active, created_at</text>
<rect x="900" y="200" width="485" height="198" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="913" y="227.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#15324F" text-anchor="start">WEBHOOK_DELIVERIES</text>
<text x="917" y="277.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">PK delivery_id</text>
<text x="917" y="296.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">FK subscription_id -&gt; subscriptions</text>
<text x="917" y="315.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">EXT event_id / parcel_id / merchant_id</text>
<text x="917" y="334.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">state_version, signed_payload_digest</text>
<text x="917" y="353.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">status, attempt_count, next_attempt_at</text>
<text x="917" y="372.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">UK (subscription_id,event_id)</text>
<rect x="95" y="605" width="485" height="150" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="108" y="632.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#15324F" text-anchor="start">CONSUMED_EVENTS / INBOX</text>
<text x="112" y="677.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">PK (consumer_name,event_id)</text>
<text x="112" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">EXT parcel_id, merchant_id</text>
<text x="112" y="715.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">event_type, version, received_at</text>
<text x="112" y="734.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">processed / scheduled_at</text>
<rect x="900" y="605" width="485" height="174" rx="8" fill="#E5F5F1" stroke="#52677C" stroke-width="1.5"/>
<text x="913" y="632.0" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#15324F" text-anchor="start">NOTIFICATIONS</text>
<text x="917" y="679.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">PK notification_id</text>
<text x="917" y="698.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">EXT event_id / recipient_sub / parcel_id</text>
<text x="917" y="717.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">channel, destination_ref, template</text>
<text x="917" y="736.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">status, attempts, next_attempt_at</text>
<text x="917" y="755.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">UK (event_id,recipient_sub,channel)</text>
<rect x="679.251953125" y="290" width="121.49609375" height="22" fill="white"/>
<text x="740.0" y="305.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="middle">1 : 0..* deliveries</text>
<rect x="630" y="580" width="220" height="170" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="635" y="622.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">INBOX is independent</text>
<text x="635" y="641.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">per consumer group.</text>
<text x="635" y="660.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Logical event IDs join</text>
<text x="635" y="679.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">job records by lookup;</text>
<text x="635" y="698.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">no FK to Kafka or</text>
<text x="635" y="717.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Delivery database.</text>
<rect x="60" y="950" width="1375" height="75" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="65" y="972.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Processing rule: atomically record consumer receipt + notification / webhook job, then commit Kafka offset. Worker attempts are persisted.</text>
<text x="65" y="992.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Exhausted retries -&gt; failed job / DLQ review. Signed webhooks carry eventId + state version; receiver deduplicates.</text>
<text x="65" y="1012.5" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#15324F" text-anchor="start">Optional WEBHOOK_ATTEMPTS child table (delivery_id FK) stores attempt timestamps / outcome; no full sensitive response bodies.</text>
</svg>