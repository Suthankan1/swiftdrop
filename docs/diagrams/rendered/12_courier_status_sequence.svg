<text x="95" y="889.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Kafka outage: outbox remains pending; relay retries. Duplicate publish: consumers deduplicate by (consumer,eventId), then persist jobs before offset commit.</text>
<rect x="90" y="933" width="1720" height="67" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="971.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Provider failure: durable backoff retries with attempt logs, then failed job / DLQ review. External side effects remain at-least-once; merchant deduplicates eventId.</text>
<rect x="90" y="1015" width="1720" height="67" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="95" y="1053.0" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">PARALLEL: Kafka tracking consumer in Delivery forwards redacted updates through Gateway SSE. Replica fan-out and reconnect recovery appear in diagram 18.</text>
