<rect x="60" y="960" width="720" height="88" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="65" y="989.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">EXT references: Accounts user / merchant / courier IDs and Pricing quote ID.</text>
<text x="65" y="1008.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Resolve through authenticated gRPC; no cross-database joins or foreign keys.</text>
<text x="65" y="1027.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Credentials and role authority remain in Keycloak / Accounts.</text>
<rect x="825" y="960" width="715" height="88" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="830" y="989.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Receipt: authorized projection generated from committed parcel / proof history.</text>
<text x="830" y="1008.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Photo and optional cached receipt object are private Delivery-owned objects.</text>
<text x="830" y="1027.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Parcel state + history + outbox + idempotency commit in one transaction.</text>
