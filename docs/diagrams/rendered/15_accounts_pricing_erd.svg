<rect x="50" y="1005" width="750" height="103" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="55" y="1032.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Keycloak owns credentials / password hashes and its separate identity DB.</text>
<text x="55" y="1051.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Accounts owns business eligibility and merchant approval.</text>
<text x="55" y="1070.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Roles here are profile mappings; JWT role checks plus domain ownership apply.</text>
<text x="55" y="1089.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">No passwords or Google tokens in these application tables.</text>
<rect x="865" y="1005" width="745" height="103" rx="8" fill="#FFF2DE" stroke="#CCA764" stroke-width="1.5"/>
<text x="870" y="1032.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Zone granularity and actual rates must be agreed with the lecturer / business.</text>
<text x="870" y="1051.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Booking validates an unexpired quote and copies its immutable price snapshot.</text>
<text x="870" y="1070.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Delivery never updates Pricing tables; later rate changes do not alter old fees.</text>
<text x="870" y="1089.5" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#15324F" text-anchor="start">Merchant key hash / scopes may be normalized to a credential table in implementation.</text>
</svg>